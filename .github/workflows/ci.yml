name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No dependency cache: Swatinem/rust-cache is LGPL-3.0, and each job takes
# under 30 seconds without one.
jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.86.0 is the rust-version in Cargo.toml.
        rust: [stable, 1.86.0]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --locked
